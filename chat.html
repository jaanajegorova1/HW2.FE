<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="web/styles/index.css" />
    <link rel="stylesheet" href="web/styles/chat.css" />
  </head>
  <body class="chatpage">
    <!--header on chatpage-->
    <div class="user">
      <div class="profile">
        <div class="name">
          <div class="frame5">
            <div class="profile_picture">
              <img src="web/assets/img/ellipse1.jpg" alt="ellipse1-image" />
            </div>
            <div class="frame4">
              <div id="name">
                <p>The CSS Whisperer<br /></p>
              </div>
              <div id="status">
                <p>Online</p>
              </div>
            </div>
          </div>
        </div>
        <div class="profileinfo" id="vector">
          <img src="web/assets/img/vector.png" alt="vector-image" />
        </div>
      </div>
    </div>

    <!--breakline-->
    <div class="breakline"></div>

    <!--main section for chat-->
    <section class="sectionchat">
      <div class="mainchat">
        <!--chat screen - frame 1481-->
        <div class="frame1481">
          <div class="frame1480">
            <div class="frame1479">
              <div class="frame1468">
                <div class="frame1467"></div>
                <p id="text">Guys,...</p>
              </div>
            </div>
          </div>
        </div>

        <!--chat screen - frame 1475-->
        <div class="frame1475"></div>

        <!--chat screen - frame 43-->
        <div class="frame43"></div>

        <!--chat screen - frame 1482-->
        <div class="frame1482"></div>

        <!--chat screen - chatform-->
        <div class="chatform">
          <div class="frame20">
            <div class="writeMessageBlock">
              <p>
                And here I was, proud of finally getting display: grid;
                place-items: center; to work... Did I miss a memo on using three
                methods simultaneously? My head is spinning.
              </p>
            </div>
          </div>
          <div class="frame21">
            <img src="web/assets/img/btn_send.png" alt="btn_send-image" />
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
