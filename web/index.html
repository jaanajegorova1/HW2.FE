<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/styles/index.css" />
  </head>
  <body>
    <div id="root">
      <!-- <h1>hello world</h1> -->
      <main class="main">
        <div class="herocat">
          <img src="/assets/img/herocat.png" alt="herocat-image" />
        </div>
        <section class="join">
          <div class="header">
            <h1>
              Identify <br />
              Yourself!
            </h1>
          </div>
          <div class="text">
            <p>
              Pick a name. We promise it's easier than <br />
              debugging a CSS issue
            </p>
          </div>
          <div class="loginform">
            <div class="login">
              <p class="logintext">Enter your name</p>
              <input class="logininput" type="text" placeholder="user123" />
            </div>
            <button class="loginbutton">Join</button>
          </div>
        </section>
      </main>
    </div>
    <script src="/assets/index.js"></script>
  </body>
</html>
